services:
  # 1. Backend Flask API & Computer Vision Processing (Docker with OpenGL/MediaPipe libs)
  - type: web
    name: courtvision-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: courtvision-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: FLASK_DEBUG
        value: "False"
      - key: PORT
        value: "10000"

  # 2. Frontend React Web Application (Static CDN - always free)
  - type: web
    name: courtvision-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: courtvision-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Managed PostgreSQL Cloud Database Service
  - name: courtvision-postgres
    databaseName: courtvision
    user: courtvision_user
    plan: free
